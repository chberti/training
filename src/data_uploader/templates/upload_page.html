<!DOCTYPE html>
<html>
<head>
    <title>Uploading & Reading CSV/XLSX file</title>
</head>
<body>
    <form method = "POST" enctype="multipart/form-data" action = "/upload">
        <input type="file" name="file" accept=".csv,.xlsx">
        <input type = "submit" value="Upload">
    </form>
    <p style="color:blue;">Choose csv/xlsx file to upload</p>
</body>
</html>
